name = "cors-test"
main = "src/index.ts"
compatibility_date = "2026-07-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

# Self-hosted fonts: no third-party requests from the page.
# Security headers for these files live in public/_headers.
[assets]
directory = "./public"

# Each test makes an outbound request on the visitor's behalf; cap it per IP
# so the tool can't be used as a free request relay.
[[ratelimits]]
name = "TEST_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
