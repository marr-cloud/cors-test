name = "cors-test"
main = "src/index.ts"
compatibility_date = "2026-07-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

# Self-hosted fonts: no third-party requests from the page.
# Security headers for these files live in public/_headers.
[assets]
directory = "./public"

# Each test makes an outbound request on the visitor's behalf; cap it per IP
# so the tool can't be used as a free request relay. Best-effort only (the
# binding is permissive and per-location); the hard limit is a zone WAF
# rate limiting rule on /inspect. namespace_id must be unique per account.
[[ratelimits]]
name = "TEST_LIMITER"
namespace_id = "20261002"
simple = { limit = 20, period = 60 }
